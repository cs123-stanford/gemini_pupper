# Parameters for the nodes gemini_pupper.launch.py adds on top of the course's
# neural_controller launch (installed by pupper_gait_deploy).

# Position/gain controllers the animation player drives. "type" lets the spawner
# register them, since the course controller_manager config doesn't list them.
forward_position_controller:
  ros__parameters:
    type: forward_command_controller/ForwardCommandController
    joints: [leg_front_r_1, leg_front_r_2, leg_front_r_3, leg_front_l_1, leg_front_l_2, leg_front_l_3,
             leg_back_r_1, leg_back_r_2, leg_back_r_3, leg_back_l_1, leg_back_l_2, leg_back_l_3]
    interface_name: position
forward_kp_controller:
  ros__parameters:
    type: forward_command_controller/ForwardCommandController
    joints: [leg_front_r_1, leg_front_r_2, leg_front_r_3, leg_front_l_1, leg_front_l_2, leg_front_l_3,
             leg_back_r_1, leg_back_r_2, leg_back_r_3, leg_back_l_1, leg_back_l_2, leg_back_l_3]
    interface_name: kp
forward_kd_controller:
  ros__parameters:
    type: forward_command_controller/ForwardCommandController
    joints: [leg_front_r_1, leg_front_r_2, leg_front_r_3, leg_front_l_1, leg_front_l_2, leg_front_l_3,
             leg_back_r_1, leg_back_r_2, leg_back_r_3, leg_back_l_1, leg_back_l_2, leg_back_l_3]
    interface_name: kd

animation_controller_py:
  ros__parameters:
    joint_names: [leg_front_r_1, leg_front_r_2, leg_front_r_3, leg_front_l_1, leg_front_l_2, leg_front_l_3,
             leg_back_r_1, leg_back_r_2, leg_back_r_3, leg_back_l_1, leg_back_l_2, leg_back_l_3]
    kps: [7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5]
    kds: [0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25]
    init_kps: [7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5]
    init_kds: [0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25]
    frame_rate: 40.0
    init_duration: 1.0

joint_state_throttler:
  ros__parameters:
    input_topic: /joint_states
    output_topic: /joint_states_throttled
    msgs_per_sec: 10.0

# Joystick (/teleop_cmd_vel) outranks Gemini (/llm_cmd_vel) outranks the person
# follower; a source that goes quiet for 500 ms is dropped.
cmd_vel_mux:
  ros__parameters:
    deadband: 0.05
    timeout_ms: 500
